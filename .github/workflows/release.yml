name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go build -ldflags "-s -w" -o tk .
            tar czf "tk_${GOOS}_${GOARCH}.tar.gz" tk
          done
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes tk_*.tar.gz
