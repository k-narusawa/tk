name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::バージョンは vX.Y.Z 形式で指定すること: $VERSION"
            exit 1
          fi
      - name: test
        run: go test ./...
      - name: build
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go build -ldflags "-s -w" -o tk .
            tar czf "tk_${GOOS}_${GOARCH}.tar.gz" tk
          done
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            tk_*.tar.gz
